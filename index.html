  <script>
    let currentMode = 'home'; // 'home', 'category', 'search'
    let currentQuery = '';
    let currentPage = 1;
    let isFetching = false;

    const movieGrid = document.getElementById("movieGrid");
    const sectionTitle = document.getElementById("sectionTitle");
    const pageBadge = document.getElementById("pageBadge");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const heroSection = document.getElementById("heroSection");
    const searchInput = document.getElementById("searchInput");
    const suggestDropdown = document.getElementById("suggestDropdown");

    // Khởi tạo
    window.addEventListener("DOMContentLoaded", () => {
      fetchMovies(true);
      initAutocomplete();
    });

    function goHome() {
      currentMode = 'home';
      currentPage = 1;
      heroSection.style.display = 'block';
      sectionTitle.innerText = 'Phim mới cập nhật';
      movieGrid.innerHTML = '';
      fetchMovies(true);
    }

    function loadCategory(type, label) {
      currentMode = 'category';
      currentQuery = type;
      currentPage = 1;
      heroSection.style.display = 'none';
      sectionTitle.innerText = label;
      movieGrid.innerHTML = '';
      fetchMovies(true);
    }

    // TÌM KIẾM CHÍNH (Đã reset về Trang 1)
    function doSearch() {
      const q = searchInput.value.trim();
      if (!q) return;
      suggestDropdown.style.display = 'none';
      currentMode = 'search';
      currentQuery = q;
      currentPage = 1;
      heroSection.style.display = 'none';
      sectionTitle.innerText = `KẾT QUẢ: ${q.toUpperCase()}`;
      movieGrid.innerHTML = '';
      fetchMovies(true);
    }

    // Gọi API lấy phim
    async function fetchMovies(isReset = false) {
      if (isFetching) return;
      isFetching = true;
      loadMoreBtn.innerHTML = '<span><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</span>';

      let url = "";
      if (currentMode === 'home') {
        url = `https://phimapi.com/danh-sach/phim-moi-cap-nhat?page=${currentPage}`;
      } else if (currentMode === 'category') {
        url = `https://phimapi.com/v1/api/danh-sach/${currentQuery}?page=${currentPage}&limit=24&_t=1793867387`;
      } else if (currentMode === 'search') {
        // API tim kiem cua phimapi chi nhan keyword va limit
        url = `https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(currentQuery)}&limit=24&_t=1793867387`;
      }

      try {
        const res = await fetch(url);
        const json = await res.json();

        // Trich xuat items dung theo json data.data.items
        let items = json?.data?.items || json?.items || [];
        const cdn = json?.data?.APP_DOMAIN_CDN_IMAGE || "https://phimimg.com";

        if (!items || items.length === 0) {
          if (isReset) {
            movieGrid.innerHTML = `<div class="col-span-full py-16 text-center text-neutral-400 text-sm">Không tìm thấy phim phù hợp với từ khóa "${currentQuery}"</div>`;
          }
          loadMoreBtn.innerHTML = '<span class="text-red-400">Không tìm thấy kết quả hoặc lỗi kết nối API</span>';
          isFetching = false;
          return;
        }

        if (currentMode === 'home' && currentPage === 1 && items.length > 0) {
          const hero = items[0];
          document.getElementById("heroImg").src = hero.thumb_url || `${cdn}/${hero.poster_url}`;
          document.getElementById("heroTitle").innerText = hero.name;
          document.getElementById("heroSub").innerText = `${hero.origin_name || ""} • ${hero.year || "2026"}`;
          document.getElementById("heroBtn").onclick = () => openMovie(hero.slug);
        }

        const cards = items.map(m => {
          let raw = m.poster_url || m.thumb_url || "";
          let poster = raw.startsWith("http") ? raw : `${cdn}/${raw}`;
          return `
            <div onclick="openMovie('${m.slug}')" class="cursor-pointer group">
              <div class="relative aspect-[2/3] rounded-lg overflow-hidden bg-neutral-900 border border-neutral-800">
                <img src="${poster}" alt="${m.name}" loading="lazy" referrerpolicy="no-referrer"
                  class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                <span class="absolute top-1 left-1 bg-yellow-400 text-black font-extrabold text-[8px] px-1 py-0.5 rounded">
                  ${m.episode_current || 'FHD'}
                </span>
              </div>
              <h4 class="text-xs font-medium text-white truncate mt-1.5">${m.name}</h4>
              <p class="text-[10px] text-neutral-400 truncate">${m.origin_name || m.year || ""}</p>
            </div>
          `;
        }).join("");

        if (isReset) {
          movieGrid.innerHTML = cards;
        } else {
          movieGrid.insertAdjacentHTML("beforeend", cards);
        }

        pageBadge.innerText = currentMode === 'search' ? 'Kết quả tìm kiếm' : `Trang ${currentPage}`;
        loadMoreBtn.innerHTML = currentMode === 'search' ? '<span>Đã hiển thị tất cả kết quả</span>' : '<span>Tải thêm phim</span>';
      } catch (err) {
        console.error("Lỗi:", err);
        loadMoreBtn.innerHTML = '<span>Lỗi tải dữ liệu, vui lòng thử lại</span>';
      }
      isFetching = false;
    }

    function loadMore() {
      currentPage++;
      fetchMovies(false);
    }

    // GỢI Ý DROPDOWN THỜI GIAN THỰC (Autocomplete)
    function initAutocomplete() {
      let timer = null;
      searchInput.addEventListener("input", function(e) {
        clearTimeout(timer);
        const q = e.target.value.trim();
        if (q.length < 2) {
          suggestDropdown.style.display = "none";
          return;
        }

        timer = setTimeout(async () => {
          try {
            const res = await fetch(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}&limit=8`);
            const data = await res.json();
            const items = data?.data?.items || [];
            const cdn = data?.data?.APP_DOMAIN_CDN_IMAGE || "https://phimimg.com";

            if (items.length === 0) {
              suggestDropdown.innerHTML = `<div class="p-3 text-center text-xs text-neutral-500">Không có gợi ý phù hợp</div>`;
              suggestDropdown.style.display = "block";
              return;
            }

            suggestDropdown.innerHTML = items.map(m => {
              const poster = m.poster_url.startsWith("http") ? m.poster_url : `${cdn}/${m.poster_url}`;
              return `
                <div class="sug-row" onclick="openMovie('${m.slug}'); suggestDropdown.style.display='none';">
                  <img src="${poster}" class="w-9 h-12 object-cover rounded bg-black shrink-0" referrerpolicy="no-referrer">
                  <div class="overflow-hidden text-left">
                    <div class="text-xs font-bold text-white truncate">${m.name}</div>
                    <div class="text-[11px] text-neutral-400 mt-0.5 truncate">${m.origin_name || ""} (${m.year || "2026"})</div>
                  </div>
                </div>
              `;
            }).join("");

            suggestDropdown.style.display = "block";
          } catch (err) {
            console.error("Lỗi dropdown:", err);
          }
        }, 200);
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest("#searchWrap")) suggestDropdown.style.display = "none";
      });
    }

    // CHI TIẾT & XEM PHIM
    async function openMovie(slug) {
      const modal = document.getElementById("movieModal");
      const title = document.getElementById("modalTitle");
      const sub = document.getElementById("modalSub");
      const desc = document.getElementById("modalDesc");
      const iframe = document.getElementById("playerIframe");
      const epList = document.getElementById("episodeList");

      modal.classList.remove("hidden");
      title.innerText = "Đang tải dữ liệu...";
      epList.innerHTML = "";
      iframe.src = "";

      try {
        const res = await fetch(`https://phimapi.com/phim/${slug}`);
        const data = await res.json();
        const m = data?.movie;
        const eps = data?.episodes?.[0]?.server_data || [];

        title.innerText = m.name;
        sub.innerText = `${m.origin_name || ""} • ${m.year} • ${m.time || ""}`;
        desc.innerHTML = m.content || "Chưa có tóm tắt cho phim này.";
        document.getElementById("modalQuality").innerText = m.quality || "FHD";

        if (eps.length > 0) {
          iframe.src = eps[0].link_embed;
          epList.innerHTML = eps.map((ep, idx) => `
            <button onclick="playEp('${ep.link_embed}', this)"
              class="ep-btn text-xs px-3 py-1.5 rounded bg-neutral-800 border border-neutral-700 text-neutral-300 font-medium ${idx === 0 ? 'bg-yellow-400 text-black border-yellow-400' : ''}">
              ${ep.name}
            </button>
          `).join("");
        }
      } catch (err) {
        title.innerText = "Lỗi nạp phim, vui lòng thử lại!";
      }
    }

    function playEp(link, btn) {
      document.getElementById("playerIframe").src = link;
      document.querySelectorAll(".ep-btn").forEach(b => {
        b.className = "ep-btn text-xs px-3 py-1.5 rounded bg-neutral-800 border border-neutral-700 text-neutral-300 font-medium";
      });
      btn.className = "ep-btn text-xs px-3 py-1.5 rounded bg-yellow-400 text-black border-yellow-400 font-bold";
    }

    function closeModal() {
      document.getElementById("movieModal").classList.add("hidden");
      document.getElementById("playerIframe").src = "";
    }

    function toggleSearch() {
      searchInput.focus();
    }
  </script>

<script>
(function() {
    let isWatching = false;

    // 1. Hook vào hàm mở phim để đẩy trạng thái vào lịch sử duyệt web
    const hookOpen = () => {
        if (typeof window.openMovie === 'function' && !window.openMovie._hooked) {
            const _orig = window.openMovie;
            window.openMovie = function() {
                isWatching = true;
                if (!location.hash.includes('xem-phim')) {
                    history.pushState({ page: 'movie' }, '', '#xem-phim');
                }
                return _orig.apply(this, arguments);
            };
            window.openMovie._hooked = true;
        }
    };
    hookOpen();
    window.addEventListener('DOMContentLoaded', hookOpen);

    // 2. Bắt sự kiện khi vuốt mép màn hình / phím Back trên Android
    window.addEventListener('popstate', function(e) {
        if (isWatching) {
            isWatching = false;
            // Tự động kích hoạt nút Quay lại trên giao diện
            const backBtn = Array.from(document.querySelectorAll('button, div, span, a')).find(
                el => el.textContent.trim().includes('Quay lại') && el.offsetParent !== null
            );
            if (backBtn) {
                backBtn.click();
            } else if (typeof closeMovie === 'function') {
                closeMovie();
            } else if (typeof backToHome === 'function') {
                backToHome();
            }
        }
    });

    // 3. Đồng bộ khi người dùng bấm trực tiếp nút Quay lại trên màn hình
    document.addEventListener('click', function(e) {
        const target = e.target.closest('button, div, a, span');
        if (target && target.textContent.trim().includes('Quay lại') && isWatching) {
            isWatching = false;
            if (location.hash.includes('xem-phim')) {
                history.back();
            }
        }
    }, true);
})();
</script>

<!-- GENRE_SCRIPT_START --><script>

s="mt-1.5 text-xs font-semibold text-neutral-100 truncate">${m.name}</h4></div>`}).join(""):`<div class="col-span-full py-20 text-center text-neutral-400">Trống</div>`}catch(e){g.innerHTML=`<div class="col-span-full py-20 text-center text-red-400">Lỗi: ${e.message}</div>`}}
