<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>PHIM 4K - Xem Phim Online Chất Lượng Cao</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0b0e; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #suggestDropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      margin-top: 6px;
      max-height: 380px;
      overflow-y: auto;
      z-index: 99999;
      box-shadow: 0 14px 35px rgba(0,0,0,0.9);
      display: none;
    }
    .sug-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid #27272a;
      cursor: pointer;
    }
    .sug-row:active, .sug-row:hover { background: #27272a; }
  </style>
</head>
<body class="pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-[#0b0b0e]/95 backdrop-blur border-b border-neutral-800 px-4 py-3">
    <div class="flex items-center justify-between">
      <div onclick="goHome()" class="flex items-center gap-2 cursor-pointer">
        <span class="text-xl font-black tracking-wider text-white">PHIM</span>
        <span class="bg-yellow-400 text-black text-xs font-black px-1.5 py-0.5 rounded">4K</span>
      </div>
      <button onclick="toggleSearch()" class="text-neutral-400 hover:text-white text-lg p-1">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <!-- Thanh tìm kiếm & Hộp gợi ý -->
    <div id="searchWrap" class="mt-3 relative">
      
    
    <div class="relative flex items-center">
        <input id="searchInput" type="text" placeholder="Tìm kiếm phim, diễn viên..."
          class="w-full bg-neutral-900 border border-neutral-700 rounded-lg py-2 pl-3 pr-10 text-sm text-white focus:outline-none focus:border-yellow-400"
          onkeydown="if(event.key==='Enter') doSearch()">
        <button onclick="doSearch()" class="absolute right-2.5 text-yellow-400 text-sm p-1">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
      <div id="suggestDropdown"></div>
    </div>
  
<!-- GENRE_NAV_START -->
    <div class="relative inline-block text-left my-2" id="genreContainer" style="z-index: 60;">
        <button id="genreBtn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-neutral-800 hover:bg-neutral-700 text-neutral-200 border border-neutral-700 transition shadow-sm">
            <span>Thể loại</span>
            <svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div id="genreDropdown" class="hidden absolute left-0 mt-2 w-64 max-h-80 overflow-y-auto bg-neutral-900/95 backdrop-blur-md border border-neutral-800 rounded-xl shadow-2xl p-2 grid grid-cols-2 gap-1">
            <button type="button" onclick="openGenrePage('hanh-dong', 'Hành Động', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Hành Động</button>
<button type="button" onclick="openGenrePage('vien-tuong', 'Viễn Tưởng', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Viễn Tưởng</button>
<button type="button" onclick="openGenrePage('kinh-di', 'Kinh Dị', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Kinh Dị</button>
<button type="button" onclick="openGenrePage('tinh-cam', 'Tình Cảm', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Tình Cảm</button>
<button type="button" onclick="openGenrePage('hai-huoc', 'Hài Hước', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Hài Hước</button>
<button type="button" onclick="openGenrePage('phieu-luu', 'Phiêu Lưu', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Phiêu Lưu</button>
<button type="button" onclick="openGenrePage('hoat-hinh', 'Hoạt Hình', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Hoạt Hình</button>
<button type="button" onclick="openGenrePage('vo-thuat', 'Võ Thuật', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Võ Thuật</button>
<button type="button" onclick="openGenrePage('co-trang', 'Cổ Trang', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Cổ Trang</button>
<button type="button" onclick="openGenrePage('tam-ly', 'Tâm Lý', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Tâm Lý</button>
<button type="button" onclick="openGenrePage('hinh-su', 'Hình Sự', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Hình Sự</button>
<button type="button" onclick="openGenrePage('chien-tranh', 'Chiến Tranh', 1)" class="text-left px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-lg transition truncate font-medium">Chiến Tranh</button>

        </div>
    </div>
    <!-- GENRE_NAV_END -->
</header>

  <!-- Banner nổi bật (Chỉ hiện ở Trang chủ) -->
  <div id="heroSection" class="px-4 mt-3">
    <div id="heroCard" class="relative rounded-xl overflow-hidden bg-neutral-900 aspect-[16/9] flex items-end p-4 border border-neutral-800">
      <img id="heroImg" class="absolute inset-0 w-full h-full object-cover opacity-60" src="" referrerpolicy="no-referrer">
      <div class="absolute inset-0 bg-gradient-to-t from-[#0b0b0e] via-transparent"></div>
      <div class="relative z-10 w-full">
        <span class="text-[10px] font-bold uppercase tracking-wider text-yellow-400 bg-yellow-400/20 px-2 py-0.5 rounded">Nổi bật</span>
        <h2 id="heroTitle" class="text-lg font-bold text-white mt-1 truncate">Đang tải...</h2>
        <p id="heroSub" class="text-xs text-neutral-400 truncate mt-0.5"></p>
        <button id="heroBtn" class="mt-2 bg-yellow-400 text-black font-bold text-xs px-4 py-1.5 rounded-full flex items-center gap-1.5">
          <i class="fa-solid fa-play text-[10px]"></i> Xem ngay
        </button>
      </div>
    </div>
  </div>

  <!-- Danh sách phim -->
  <main class="px-4 mt-6">
    <div class="flex items-center justify-between mb-3">
      <h3 id="sectionTitle" class="text-sm font-bold uppercase tracking-wide text-neutral-300">Phim mới cập nhật</h3>
      <span id="pageBadge" class="text-xs text-neutral-500">Trang 1</span>
    </div>

    <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3"></div>

    <div class="mt-6 text-center">
      <button id="loadMoreBtn" onclick="loadMore()" class="w-full bg-neutral-900 border border-neutral-800 hover:border-yellow-400 text-xs text-neutral-300 py-3 rounded-xl font-medium transition">
        <span>Tải thêm phim</span>
      </button>
    </div>
  <!-- GENRE_PAGE_CONTAINER_START -->
    <section id="genrePageSection" class="hidden min-h-screen px-4 pb-28 max-w-7xl mx-auto">
        <div class="flex items-center justify-between py-4 border-b border-neutral-800 mb-6">
            <div class="flex items-center gap-3">
                <button type="button" onclick="closeGenrePage()" class="px-3 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 rounded-lg border border-neutral-700 text-xs flex items-center gap-1.5 font-medium transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    <span>Trang chủ</span>
                </button>
                <h2 id="genrePageHeading" class="text-base sm:text-lg font-bold text-white tracking-wide">Thể loại</h2>
            </div>
            <span id="genreTotalBadge" class="text-xs bg-neutral-800 text-neutral-400 px-2.5 py-1 rounded-full border border-neutral-700">Trang 1</span>
        </div>

        <div id="genreMoviesGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3"></div>

        <div class="flex items-center justify-center gap-3 mt-10 py-6 border-t border-neutral-800" id="genrePagination">
            <button id="genrePrevBtn" onclick="changeGenrePage(-1)" class="px-4 py-2 text-xs font-semibold rounded-lg bg-neutral-800 hover:bg-neutral-700 disabled:opacity-30 disabled:pointer-events-none text-white border border-neutral-700 transition">← Trang trước</button>
            <span id="genrePageIndicator" class="text-xs text-neutral-400 font-medium">Trang 1</span>
            <button id="genreNextBtn" onclick="changeGenrePage(1)" class="px-4 py-2 text-xs font-semibold rounded-lg bg-neutral-800 hover:bg-neutral-700 disabled:opacity-30 disabled:pointer-events-none text-white border border-neutral-700 transition">Trang sau →</button>
        </div>
    </section>
    <!-- GENRE_PAGE_CONTAINER_END -->
</main>

  <!-- Modal xem phim & chi tiết -->
  <div id="movieModal" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur hidden overflow-y-auto p-4">
    <div class="max-w-2xl mx-auto pb-12">
      <div class="flex justify-between items-center mb-3">
        <button onclick="closeModal()" class="text-neutral-400 hover:text-white text-sm flex items-center gap-1">
          <i class="fa-solid fa-chevron-left"></i> Quay lại
        </button>
        <span id="modalQuality" class="text-[10px] bg-yellow-400 text-black font-bold px-1.5 py-0.5 rounded">FHD</span>
      </div>

      <!-- Trình phát Video -->
      <div class="relative aspect-video bg-black rounded-lg overflow-hidden border border-neutral-800 mb-4">
        <iframe id="playerIframe" class="w-full h-full" src="" frameborder="0" allowfullscreen referrerpolicy="no-referrer"></iframe>
      </div>

      <h1 id="modalTitle" class="text-lg font-bold text-white mb-1"></h1>
      <p id="modalSub" class="text-xs text-neutral-400 mb-3"></p>
      
      <!-- Danh sách tập -->
      <div class="mb-4">
        <h4 class="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-2">Chọn tập phim:</h4>
        <div id="episodeList" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto no-scrollbar"></div>
      </div>

      <div class="bg-neutral-900/60 p-3 rounded-lg border border-neutral-800">
        <h4 class="text-xs font-bold text-neutral-300 mb-1">Nội dung phim:</h4>
        <p id="modalDesc" class="text-xs text-neutral-400 leading-relaxed max-h-32 overflow-y-auto no-scrollbar"></p>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0b0b0e]/95 backdrop-blur border-t border-neutral-800 flex justify-around py-2.5 text-xs text-neutral-400">
    <button onclick="goHome()" class="flex flex-col items-center gap-1 text-yellow-400">
      <i class="fa-solid fa-house"></i><span>Home</span>
    </button>
    <button onclick="loadCategory('phim-bo', 'Phim Bộ')" class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-film"></i><span>Phim Bộ</span>
    </button>
    <button onclick="loadCategory('phim-le', 'Phim Lẻ')" class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-video"></i><span>Phim Lẻ</span>
    </button>
    <button onclick="loadCategory('hoat-hinh', 'Hoạt Hình')" class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-wand-magic-sparkles"></i><span>Hoạt Hình</span>
    </button>
  </nav>

  <script>
    let currentMode = 'home'; // 'home', 'category', 'search'
    let currentQuery = '';
    let currentPage = 1;
    let isFetching = false;

    const movieGrid = document.getElementById("movieGrid");
    const sectionTitle = document.getElementById("sectionTitle");
    const pageBadge = document.getElementById("pageBadge");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const heroSection = document.getElementById("heroSection");
    const searchInput = document.getElementById("searchInput");
    const suggestDropdown = document.getElementById("suggestDropdown");

    // Khởi tạo
    window.addEventListener("DOMContentLoaded", () => {
      fetchMovies(true);
      initAutocomplete();
    });

    function goHome() {
      currentMode = 'home';
      currentPage = 1;
      heroSection.style.display = 'block';
      sectionTitle.innerText = 'Phim mới cập nhật';
      movieGrid.innerHTML = '';
      fetchMovies(true);
    }

    function loadCategory(type, label) {
      currentMode = 'category';
      currentQuery = type;
      currentPage = 1;
      heroSection.style.display = 'none';
      sectionTitle.innerText = label;
      movieGrid.innerHTML = '';
      fetchMovies(true);
    }

    // TÌM KIẾM CHÍNH (Đã reset về Trang 1)
    function doSearch() {
      const q = searchInput.value.trim();
      if (!q) return;
      suggestDropdown.style.display = 'none';
      currentMode = 'search';
      currentQuery = q;
      currentPage = 1;
      heroSection.style.display = 'none';
      sectionTitle.innerText = `KẾT QUẢ: ${q.toUpperCase()}`;
      movieGrid.innerHTML = '';
      fetchMovies(true);
    }

    // Gọi API lấy phim
    async function fetchMovies(isReset = false) {
      if (isFetching) return;
      isFetching = true;
      loadMoreBtn.innerHTML = '<span><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</span>';

      let url = "";
      if (currentMode === 'home') {
        url = `https://phimapi.com/danh-sach/phim-moi-cap-nhat?page=${currentPage}`;
      } else if (currentMode === 'category') {
        url = `https://phimapi.com/v1/api/danh-sach/${currentQuery}?page=${currentPage}&limit=24&_t=1793867387`;
      } else if (currentMode === 'search') {
        // API tim kiem cua phimapi chi nhan keyword va limit
        url = `https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(currentQuery)}&limit=24&_t=1793867387`;
      }

      try {
        const res = await fetch(url);
        const json = await res.json();

        // Trich xuat items dung theo json data.data.items
        let items = json?.data?.items || json?.items || [];
        const cdn = json?.data?.APP_DOMAIN_CDN_IMAGE || "https://phimimg.com";

        if (!items || items.length === 0) {
          if (isReset) {
            movieGrid.innerHTML = `<div class="col-span-full py-16 text-center text-neutral-400 text-sm">Không tìm thấy phim phù hợp với từ khóa "${currentQuery}"</div>`;
          }
          loadMoreBtn.innerHTML = '<span class="text-red-400">Không tìm thấy kết quả hoặc lỗi kết nối API</span>';
          isFetching = false;
          return;
        }

        if (currentMode === 'home' && currentPage === 1 && items.length > 0) {
          const hero = items[0];
          document.getElementById("heroImg").src = hero.thumb_url || `${cdn}/${hero.poster_url}`;
          document.getElementById("heroTitle").innerText = hero.name;
          document.getElementById("heroSub").innerText = `${hero.origin_name || ""} • ${hero.year || "2026"}`;
          document.getElementById("heroBtn").onclick = () => openMovie(hero.slug);
        }

        const cards = items.map(m => {
          let raw = m.poster_url || m.thumb_url || "";
          let poster = raw.startsWith("http") ? raw : `${cdn}/${raw}`;
          return `
            <div onclick="openMovie('${m.slug}')" class="cursor-pointer group">
              <div class="relative aspect-[2/3] rounded-lg overflow-hidden bg-neutral-900 border border-neutral-800">
                <img src="${poster}" alt="${m.name}" loading="lazy" referrerpolicy="no-referrer"
                  class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                <span class="absolute top-1 left-1 bg-yellow-400 text-black font-extrabold text-[8px] px-1 py-0.5 rounded">
                  ${m.episode_current || 'FHD'}
                </span>
              </div>
              <h4 class="text-xs font-medium text-white truncate mt-1.5">${m.name}</h4>
              <p class="text-[10px] text-neutral-400 truncate">${m.origin_name || m.year || ""}</p>
            </div>
          `;
        }).join("");

        if (isReset) {
          movieGrid.innerHTML = cards;
        } else {
          movieGrid.insertAdjacentHTML("beforeend", cards);
        }

        pageBadge.innerText = currentMode === 'search' ? 'Kết quả tìm kiếm' : `Trang ${currentPage}`;
        loadMoreBtn.innerHTML = currentMode === 'search' ? '<span>Đã hiển thị tất cả kết quả</span>' : '<span>Tải thêm phim</span>';
      } catch (err) {
        console.error("Lỗi:", err);
        loadMoreBtn.innerHTML = '<span>Lỗi tải dữ liệu, vui lòng thử lại</span>';
      }
      isFetching = false;
    }

    function loadMore() {
      currentPage++;
      fetchMovies(false);
    }

    // GỢI Ý DROPDOWN THỜI GIAN THỰC (Autocomplete)
    function initAutocomplete() {
      let timer = null;
      searchInput.addEventListener("input", function(e) {
        clearTimeout(timer);
        const q = e.target.value.trim();
        if (q.length < 2) {
          suggestDropdown.style.display = "none";
          return;
        }

        timer = setTimeout(async () => {
          try {
            const res = await fetch(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}&limit=8`);
            const data = await res.json();
            const items = data?.data?.items || [];
            const cdn = data?.data?.APP_DOMAIN_CDN_IMAGE || "https://phimimg.com";

            if (items.length === 0) {
              suggestDropdown.innerHTML = `<div class="p-3 text-center text-xs text-neutral-500">Không có gợi ý phù hợp</div>`;
              suggestDropdown.style.display = "block";
              return;
            }

            suggestDropdown.innerHTML = items.map(m => {
              const poster = m.poster_url.startsWith("http") ? m.poster_url : `${cdn}/${m.poster_url}`;
              return `
                <div class="sug-row" onclick="openMovie('${m.slug}'); suggestDropdown.style.display='none';">
                  <img src="${poster}" class="w-9 h-12 object-cover rounded bg-black shrink-0" referrerpolicy="no-referrer">
                  <div class="overflow-hidden text-left">
                    <div class="text-xs font-bold text-white truncate">${m.name}</div>
                    <div class="text-[11px] text-neutral-400 mt-0.5 truncate">${m.origin_name || ""} (${m.year || "2026"})</div>
                  </div>
                </div>
              `;
            }).join("");

            suggestDropdown.style.display = "block";
          } catch (err) {
            console.error("Lỗi dropdown:", err);
          }
        }, 200);
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest("#searchWrap")) suggestDropdown.style.display = "none";
      });
    }

    // CHI TIẾT & XEM PHIM
    async function openMovie(slug) {
      const modal = document.getElementById("movieModal");
      const title = document.getElementById("modalTitle");
      const sub = document.getElementById("modalSub");
      const desc = document.getElementById("modalDesc");
      const iframe = document.getElementById("playerIframe");
      const epList = document.getElementById("episodeList");

      modal.classList.remove("hidden");
      title.innerText = "Đang tải dữ liệu...";
      epList.innerHTML = "";
      iframe.src = "";

      try {
        const res = await fetch(`https://phimapi.com/phim/${slug}`);
        const data = await res.json();
        const m = data?.movie;
        const eps = data?.episodes?.[0]?.server_data || [];

        title.innerText = m.name;
        sub.innerText = `${m.origin_name || ""} • ${m.year} • ${m.time || ""}`;
        desc.innerHTML = m.content || "Chưa có tóm tắt cho phim này.";
        document.getElementById("modalQuality").innerText = m.quality || "FHD";

        if (eps.length > 0) {
          iframe.src = eps[0].link_embed;
          epList.innerHTML = eps.map((ep, idx) => `
            <button onclick="playEp('${ep.link_embed}', this)"
              class="ep-btn text-xs px-3 py-1.5 rounded bg-neutral-800 border border-neutral-700 text-neutral-300 font-medium ${idx === 0 ? 'bg-yellow-400 text-black border-yellow-400' : ''}">
              ${ep.name}
            </button>
          `).join("");
        }
      } catch (err) {
        title.innerText = "Lỗi nạp phim, vui lòng thử lại!";
      }
    }

    function playEp(link, btn) {
      document.getElementById("playerIframe").src = link;
      document.querySelectorAll(".ep-btn").forEach(b => {
        b.className = "ep-btn text-xs px-3 py-1.5 rounded bg-neutral-800 border border-neutral-700 text-neutral-300 font-medium";
      });
      btn.className = "ep-btn text-xs px-3 py-1.5 rounded bg-yellow-400 text-black border-yellow-400 font-bold";
    }

    function closeModal() {
      document.getElementById("movieModal").classList.add("hidden");
      document.getElementById("playerIframe").src = "";
    }

    function toggleSearch() {
      searchInput.focus();
    }
  </script>

<!-- FIX_BACK_GESTURE_START -->
<script>
(function() {
    let isWatching = false;

    // 1. Hook vào hàm mở phim để đẩy trạng thái vào lịch sử duyệt web
    const hookOpen = () => {
        if (typeof window.openMovie === 'function' && !window.openMovie._hooked) {
            const _orig = window.openMovie;
            window.openMovie = function() {
                isWatching = true;
                if (!location.hash.includes('xem-phim')) {
                    history.pushState({ page: 'movie' }, '', '#xem-phim');
                }
                return _orig.apply(this, arguments);
            };
            window.openMovie._hooked = true;
        }
    };
    hookOpen();
    window.addEventListener('DOMContentLoaded', hookOpen);

    // 2. Bắt sự kiện khi vuốt mép màn hình / phím Back trên Android
    window.addEventListener('popstate', function(e) {
        if (isWatching) {
            isWatching = false;
            // Tự động kích hoạt nút Quay lại trên giao diện
            const backBtn = Array.from(document.querySelectorAll('button, div, span, a')).find(
                el => el.textContent.trim().includes('Quay lại') && el.offsetParent !== null
            );
            if (backBtn) {
                backBtn.click();
            } else if (typeof closeMovie === 'function') {
                closeMovie();
            } else if (typeof backToHome === 'function') {
                backToHome();
            }
        }
    });

    // 3. Đồng bộ khi người dùng bấm trực tiếp nút Quay lại trên màn hình
    document.addEventListener('click', function(e) {
        const target = e.target.closest('button, div, a, span');
        if (target && target.textContent.trim().includes('Quay lại') && isWatching) {
            isWatching = false;
            if (location.hash.includes('xem-phim')) {
                history.back();
            }
        }
    }, true);
})();
</script>

<!-- GENRE_SCRIPT_START -->
    <script>
    let currentGenreSlug = "";
    let currentGenreName = "";
    let currentGenrePage = 1;
    let maxGenrePages = 1;

    document.addEventListener("DOMContentLoaded", () => {
        const btn = document.getElementById("genreBtn");
        const menu = document.getElementById("genreDropdown");
        if (btn && menu) {
            btn.onclick = (e) => {
                e.stopPropagation();
                menu.classList.toggle("hidden");
            };
            document.addEventListener("click", (e) => {
                if (!menu.contains(e.target) && !btn.contains(e.target)) {
                    menu.classList.add("hidden");
                }
            });
        }
    });

    function closeGenrePage() {
        const genreSec = document.getElementById("genrePageSection");
        if (genreSec) genreSec.classList.add("hidden");
        document.querySelectorAll("main > *:not(#genrePageSection), header ~ div:not(#genrePageSection)").forEach(el => {
            if (el.id !== "genrePageSection" && !el.contains(genreSec)) {
                el.style.display = "";
            }
        });
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function openGenrePage(slug, name, page = 1) {
        currentGenreSlug = slug;
        currentGenreName = name;
        currentGenrePage = page;

        const menu = document.getElementById("genreDropdown");
        if (menu) menu.classList.add("hidden");

        document.querySelectorAll("main > *:not(#genrePageSection), header ~ div:not(#genrePageSection)").forEach(el => {
            if (el.id !== "genrePageSection" && !el.id.includes("footer") && !el.contains(document.getElementById("genrePageSection"))) {
                el.style.display = "none";
            }
        });

        const genreSec = document.getElementById("genrePageSection");
        const heading = document.getElementById("genrePageHeading");
        const grid = document.getElementById("genreMoviesGrid");
        const indicator = document.getElementById("genrePageIndicator");
        const badge = document.getElementById("genreTotalBadge");
        const prevBtn = document.getElementById("genrePrevBtn");
        const nextBtn = document.getElementById("genreNextBtn");

        if (!genreSec || !grid) return;

        genreSec.classList.remove("hidden");
        heading.textContent = "Thể loại: " + name;
        grid.innerHTML = '<div class="col-span-full py-20 text-center text-neutral-400 text-sm animate-pulse">Đang tải thể loại ' + name + ' (Trang ' + page + ')...</div>';
        window.scrollTo({ top: 0, behavior: "smooth" });

        try {
            const res = await fetch(`https://phimapi.com/v1/api/the-loai/${slug}?page=${page}&limit=24`);
            const data = await res.json();
            const items = data?.data?.items || data?.items || [];
            const pagination = data?.data?.params?.pagination || {};

            maxGenrePages = pagination.totalPages || Math.ceil((pagination.totalItems || 100) / (pagination.totalItemsPerPage || 24)) || 10;

            indicator.textContent = `Trang ${page} / ${maxGenrePages}`;
            badge.textContent = `Trang ${page} / ${maxGenrePages}`;
            prevBtn.disabled = page <= 1;
            nextBtn.disabled = page >= maxGenrePages;

            if (items.length > 0) {
                grid.innerHTML = items.map(m => {
                    const poster = m.poster_url || m.thumb_url || "";
                    const imgUrl = poster.startsWith("http") ? poster : `https://phimimg.com/${poster}`;
                    const episodeBadge = m.episode_current ? `<span class="absolute top-1.5 left-1.5 bg-red-600/90 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow">${m.episode_current}</span>` : "";
                    const qualityBadge = m.quality ? `<span class="absolute top-1.5 right-1.5 bg-yellow-500/90 text-black text-[10px] font-extrabold px-1.5 py-0.5 rounded shadow">${m.quality}</span>` : "";

                    return `
                    <div class="cursor-pointer group flex flex-col" onclick="typeof loadMovieDetail === 'function' ? loadMovieDetail('${m.slug}') : (window.location.hash = '${m.slug}')">
                        <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-neutral-800 shadow-md">
                            <img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=No+Cover'"/>
                            ${episodeBadge}
                            ${qualityBadge}
                        </div>
                        <h4 class="mt-2 text-xs font-semibold text-neutral-100 truncate group-hover:text-yellow-400 transition">${m.name}</h4>
                        <p class="text-[10px] text-neutral-400 truncate">${m.origin_name || ''}</p>
                    </div>`;
                }).join("");
            } else {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-neutral-400 text-sm">Chưa có phim trong mục này.</div>';
            }
        } catch (err) {
            grid.innerHTML = `<div class="col-span-full py-20 text-center text-red-400 text-sm">Lỗi tải dữ liệu: ${err.message}</div>`;
        }
    }

    function changeGenrePage(offset) {
        const targetPage = currentGenrePage + offset;
        if (targetPage >= 1 && targetPage <= maxGenrePages) {
            openGenrePage(currentGenreSlug, currentGenreName, targetPage);
        }
    }
    </script>
    <!-- GENRE_SCRIPT_END -->
</body>
